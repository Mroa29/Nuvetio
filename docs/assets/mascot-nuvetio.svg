<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Nuvetio, mascota coordinadora del equipo</title>
  <desc id="desc">Una mascota virtual azul y turquesa con tres nodos luminosos que representan los departamentos especializados de Nuvetio.</desc>
  <defs>
    <linearGradient id="body" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2b72ff"/>
      <stop offset="1" stop-color="#0b1d42"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#bffcf7"/>
      <stop offset="1" stop-color="#36cfc9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <circle cx="80" cy="80" r="68" fill="#081632"/>
  <circle cx="80" cy="80" r="58" fill="url(#body)"/>
  <path d="M45 62 56 36l20 17m39 9-11-26-20 17" fill="none" stroke="#bffcf7" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/>
  <circle cx="62" cy="77" r="8" fill="#fff"/>
  <circle cx="98" cy="77" r="8" fill="#fff"/>
  <circle cx="62" cy="77" r="3" fill="#081632"/>
  <circle cx="98" cy="77" r="3" fill="#081632"/>
  <path d="M65 101c8 8 22 8 30 0" fill="none" stroke="#bffcf7" stroke-linecap="round" stroke-width="5"/>
  <path d="M80 53v-9m-28 68-13 13m69-13 13 13" stroke="#36cfc9" stroke-linecap="round" stroke-width="4"/>
  <circle cx="80" cy="39" r="9" fill="url(#glow)"/>
  <circle cx="36" cy="128" r="9" fill="url(#glow)"/>
  <circle cx="124" cy="128" r="9" fill="url(#glow)"/>
  <circle cx="80" cy="39" r="16" fill="#36cfc9" opacity=".25" filter="url(#soft)"/>
  <circle cx="36" cy="128" r="16" fill="#36cfc9" opacity=".25" filter="url(#soft)"/>
  <circle cx="124" cy="128" r="16" fill="#36cfc9" opacity=".25" filter="url(#soft)"/>
</svg>
